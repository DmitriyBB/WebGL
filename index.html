<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel parallax demo</title>
<style>
  body { margin: 0; background: #111; font-family: system-ui, sans-serif; color: #fff; }
  .banner { position: relative; max-width: 1100px; margin: 30px auto; aspect-ratio: 16 / 7; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .content { position: relative; z-index: 1; padding: 28px 36px; pointer-events: none; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 56px); text-transform: uppercase; text-shadow: 0 3px 0 #000; max-width: 9em; line-height: .95; }
  .hint { margin-top: 12px; font-size: 14px; opacity: .8; }
  .stats { margin: 20px 36px 0; font: 12px/1.4 monospace; color: #aaa; max-width: 1100px; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <canvas id="c"></canvas>
  <div class="content">
    <h1>Halloween Sale</h1>
    <div class="hint">Двигайте мышью по баннеру</div>
  </div>
</div>
<div class="stats" id="stats"></div>

<script>
const banner = document.getElementById('banner');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 320, H = 140;               // низкое разрешение → пиксельный вид
canvas.width = W; canvas.height = H;

// --- мышь: нормализация -0.5..0.5 и lerp 0.15, как на itch.io ---
let target = [0, 0], mouse = [0, 0];
const clamp = v => Math.max(-.5, Math.min(.5, v));
banner.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  target = [clamp((e.clientX - r.left) / r.width - .5), clamp((e.clientY - r.top) / r.height - .5)];
});
banner.addEventListener('pointerleave', () => target = [0, 0]);

// --- детерминированный рандом ---
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// --- сцена: слои с глубиной (чем больше depth, тем сильнее сдвиг) ---
const stars = Array.from({ length: 70 }, () => ({ x: rnd() * W, y: rnd() * H * .6, p: rnd() * 6 }));
const hills = [];  for (let x = -40; x < W + 40; x += 4) hills.push(95 + Math.sin(x * .03) * 10 + Math.sin(x * .09) * 4);
const trees = [];  for (let i = 0; i < 16; i++) trees.push({ x: rnd() * (W + 120) - 60, h: 28 + rnd() * 24, d: .55 });
const trees2 = []; for (let i = 0; i < 9; i++)  trees2.push({ x: rnd() * (W + 200) - 100, h: 46 + rnd() * 30, d: .85 });
const graves = []; for (let i = 0; i < 7; i++)  graves.push({ x: rnd() * (W + 240) - 120, h: 10 + rnd() * 8, d: 1.2 });
const bats = Array.from({ length: 4 }, (_, i) => ({ x: 40 + i * 70, y: 25 + rnd() * 20, s: .6 + rnd() * .6 }));

function tree(x, base, h, col) {
  ctx.fillStyle = col;
  for (let i = 0; i < h; i += 2) {
    const w = Math.max(1, Math.round((h - i) * .28));
    ctx.fillRect(Math.round(x - w / 2), base - i, w, 2);
  }
  ctx.fillRect(Math.round(x - 1), base, 2, 4);
}

function render(t) {
  // как в оригинале: медленный дрейф + смещение от мыши
  const camX = Math.sin(t * .13) * .8 + mouse[0] * .6;
  const camY = Math.sin(t * .21) * .15 - mouse[1] * .3;
  const px = camX * -40;            // перевод «единиц сцены» в пиксели
  const py = camY * -40;

  // небо
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0820'); g.addColorStop(.6, '#2a1445'); g.addColorStop(1, '#5a2a3a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // звёзды (очень далеко)
  for (const s of stars) {
    ctx.globalAlpha = .5 + .5 * Math.sin(t * 2 + s.p);
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(s.x + px * .05), Math.round(s.y + py * .05), 1, 1);
  }
  ctx.globalAlpha = 1;

  // луна (depth .1)
  const mx = Math.round(235 + px * .1), my = Math.round(30 + py * .1);
  ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(mx, my, 14, 0, 7); ctx.fill();
  ctx.fillStyle = '#e0c878'; ctx.fillRect(mx - 5, my - 3, 4, 3); ctx.fillRect(mx + 3, my + 4, 3, 3);

  // летучие мыши (свой sway/bob)
  ctx.fillStyle = '#000';
  for (const b of bats) {
    const bx = (b.x + t * 8 * b.s + px * .3) % (W + 40) - 20;
    const by = b.y + Math.sin(t * 3 * b.s + b.x) * 4 + py * .3;
    const flap = Math.sin(t * 14) > 0 ? 2 : -1;
    ctx.fillRect(Math.round(bx), Math.round(by), 3, 2);
    ctx.fillRect(Math.round(bx) - 3, Math.round(by) + flap, 3, 1);
    ctx.fillRect(Math.round(bx) + 3, Math.round(by) + flap, 3, 1);
  }

  // дальние холмы (depth .25)
  ctx.fillStyle = '#1b0f33';
  ctx.beginPath(); ctx.moveTo(-40, H);
  hills.forEach((y, i) => ctx.lineTo(-40 + i * 4 + px * .25, y + py * .25));
  ctx.lineTo(W + 40, H); ctx.fill();

  // деревья: дальние и ближние
  for (const tr of trees)  tree(tr.x + px * tr.d, 110 + py * tr.d, tr.h, '#140a26');
  for (const tr of trees2) tree(tr.x + px * tr.d, 125 + py * tr.d, tr.h, '#0b0616');

  // земля
  ctx.fillStyle = '#07040d'; ctx.fillRect(0, 122 + py * 1.1, W, H);

  // надгробия (самый ближний слой — сдвиг сильнее всего)
  for (const gr of graves) {
    const x = Math.round(gr.x + px * gr.d), y = Math.round(128 + py * gr.d);
    ctx.fillStyle = '#2a2438'; ctx.fillRect(x, y - gr.h, 8, gr.h);
    ctx.fillRect(x + 1, y - gr.h - 1, 6, 1);
    ctx.fillStyle = '#463c5c'; ctx.fillRect(x + 3, y - gr.h + 3, 2, 5); ctx.fillRect(x + 2, y - gr.h + 4, 4, 1);
  }

  // туман
  const f = ctx.createLinearGradient(0, 100, 0, H);
  f.addColorStop(0, 'rgba(120,60,140,0)'); f.addColorStop(1, 'rgba(120,60,140,.25)');
  ctx.fillStyle = f; ctx.fillRect(0, 100, W, H - 100);
}

const stats = document.getElementById('stats');
(function loop(ms) {
  mouse = mouse.map((v, i) => v + (target[i] - v) * .15);   // lerp 0.15
  render(ms / 1000);
  stats.textContent = `mouse = [${mouse[0].toFixed(3)}, ${mouse[1].toFixed(3)}]   target = [${target[0].toFixed(3)}, ${target[1].toFixed(3)}]`;
  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
